name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o dist/lnreadertui-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Package Windows portable zip
        if: matrix.goos == 'windows'
        run: |
          cd dist
          cp lnreadertui-windows-${{ matrix.goarch }}.exe lnreadertui.exe
          python3 - <<'EOF'
          import zipfile, os
          with zipfile.ZipFile('lnreadertui-windows-${{ matrix.goarch }}.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('lnreadertui.exe')
          os.remove('lnreadertui.exe')
          print('created zip')
          EOF

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true